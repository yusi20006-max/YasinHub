name: Issue 186 automated fix

on:
  push:
    branches:
      - fix/issue-186-hub-port-propagation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'yusi20006-max' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-186-hub-port-propagation
          fetch-depth: 0

      - name: Apply focused port propagation fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('yasinhub/startup.py')
          text = p.read_text(encoding='utf-8')
          old = '''    check_port = int(port) if port is not None else resolve_hub_port()\n    _ = host  # bind address is owned by yasinhub.api.server.run()\n    _ = check_port\n'''
          new = '''    check_port = int(port) if port is not None else resolve_hub_port()\n    _ = host  # bind address is owned by yasinhub.api.server.run()\n'''
          if old not in text:
              raise SystemExit('expected startup.py block not found')
          text = text.replace(old, new, 1)
          old = '''    argv = [sys.executable, "-m", "yasinhub.api.server"]\n    factory = popen_factory or subprocess.Popen\n    proc = factory(\n        argv,\n        cwd=str(_hub_repo_root()),\n        stdin=subprocess.DEVNULL,\n        stdout=log_file,\n        stderr=subprocess.STDOUT,\n        start_new_session=True,\n    )\n'''
          new = '''    argv = [sys.executable, "-m", "yasinhub.api.server"]\n    child_env = os.environ.copy()\n    child_env["YASINHUB_PORT"] = str(check_port)\n    factory = popen_factory or subprocess.Popen\n    proc = factory(\n        argv,\n        cwd=str(_hub_repo_root()),\n        env=child_env,\n        stdin=subprocess.DEVNULL,\n        stdout=log_file,\n        stderr=subprocess.STDOUT,\n        start_new_session=True,\n    )\n'''
          if old not in text:
              raise SystemExit('expected Popen block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_startup_port_propagation.py <<'PY'
          from pathlib import Path

          from yasinhub import startup


          class FakeProcess:
              pid = 43210

              def poll(self):
                  return None


          def test_start_hub_process_propagates_explicit_port(tmp_path, monkeypatch):
              captured = {}

              def fake_popen(argv, **kwargs):
                  captured['argv'] = argv
                  captured['env'] = kwargs['env']
                  return FakeProcess()

              monkeypatch.delenv('YASINHUB_PORT', raising=False)
              monkeypatch.setattr(startup, 'save_pid', lambda *_: None)
              startup.start_hub_process(
                  host='127.0.0.1',
                  port=7123,
                  logs_dir=tmp_path,
                  popen_factory=fake_popen,
              )

              assert captured['argv'] == [startup.sys.executable, '-m', 'yasinhub.api.server']
              assert captured['env']['YASINHUB_PORT'] == '7123'


          def test_start_hub_process_propagates_resolved_canonical_port(tmp_path, monkeypatch):
              captured = {}

              def fake_popen(argv, **kwargs):
                  captured['env'] = kwargs['env']
                  return FakeProcess()

              monkeypatch.delenv('YASINHUB_PORT', raising=False)
              monkeypatch.setattr(startup, 'port_for', lambda name: None)
              monkeypatch.setattr(startup, 'save_pid', lambda *_: None)
              startup.start_hub_process(logs_dir=tmp_path, popen_factory=fake_popen)

              assert captured['env']['YASINHUB_PORT'] == '7000'
          PY

          rm .github/workflows/issue-186-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yasinhub/startup.py tests/test_startup_port_propagation.py .github/workflows/issue-186-fix.yml
          git commit -m 'fix(startup): propagate resolved Hub port to API server'
          git push origin fix/issue-186-hub-port-propagation
