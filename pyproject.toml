[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-hub"
dynamic = ["version"]
description = "YasinHub: status and lifecycle observer CLI for the Yasin ecosystem (not a full control plane)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "yasinhub.__version__"}

[tool.setuptools.packages.find]
include = ["yasinhub*"]
