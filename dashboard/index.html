<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>YasinHub Dashboard</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<header>

<h1>🟢 YasinHub Dashboard</h1>

<p>مدیریت اکوسیستم یاسین</p>

<div id="connection-status"></div>

<button id="theme-toggle">
🌙 تغییر تم
</button>

</header>



<section id="summary">

<div>
<h3>کل پروژه‌ها</h3>
<span id="total-services">0</span>
</div>


<div>
<h3>موفق</h3>
<span id="success">0</span>
</div>


<div>
<h3>در حال اجرا</h3>
<span id="running">0</span>
</div>


<div>
<h3>خطا</h3>
<span id="failed">0</span>
</div>


<div>
<h3>نامشخص</h3>
<span id="unknown">0</span>
</div>


<div>
<h3>کل پست‌ها</h3>
<span id="total-posts">0</span>
</div>


<div>
<h3>منتشر شده</h3>
<span id="published">0</span>
</div>


<div>
<h3>در انتظار</h3>
<span id="pending">0</span>
</div>


</section>




<h2>Services</h2>

<table>

<thead>

<tr>

<th>نام</th>

<th>وضعیت</th>

<th>کنترل</th>

</tr>

</thead>


<tbody id="services-body">

</tbody>


</table>





<h2>Events</h2>

<div id="events">

</div>





<h2>Logs</h2>

<div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;">
    <div>
        <label for="log-service">سرویس:</label>
        <select id="log-service" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit;">
            <option value="yasinrelay">yasinrelay</option>
        </select>
    </div>

    <div>
        <label for="log-filter">جستجو در لاگ‌ها:</label>
        <input type="text" id="log-filter" placeholder="مثال: ERROR" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit;">
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="realtime-logs" style="width: 18px; height: 18px; cursor: pointer;">
        <label for="realtime-logs" style="cursor: pointer; user-select: none;">به‌روزرسانی خودکار (Realtime)</label>
    </div>
</div>


<pre id="logs"></pre>




<script src="app.js"></script>


</body>

</html>
