<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>YasinHub Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <h1>YasinHub</h1>
    </div>
    <div class="header-meta">
      <span id="connection-status" class="connection-status" role="status" aria-live="polite" aria-atomic="true">…</span>
      <span id="stale-indicator" class="stale-indicator" hidden title="Data may be stale">stale</span>
      <button type="button" id="yasin-chat-open" class="btn-secondary">Yasin</button>
      <button type="button" id="theme-toggle" class="btn-ghost" aria-label="Toggle theme" aria-pressed="false">Theme</button>
    </div>
  </header>

  <div class="app-shell">
    <nav id="sidebar" class="sidebar" aria-label="Primary">
      <ul>
        <li><a href="#/" data-nav="overview">Overview</a></li>
        <li><a href="#/executions" data-nav="executions">Executions</a></li>
        <li><a href="#/fleets" data-nav="fleets">Fleets</a></li>
        <li><a href="#/events" data-nav="events">Events</a></li>
      </ul>
      <p class="nav-footnote">Observer · Control plane surface. No shell/filesystem access.</p>
    </nav>

    <main id="main" class="main">
      <div class="page-heading">
        <h2 id="page-title">Overview</h2>
        <button type="button" id="refresh-btn" class="btn-secondary">Refresh</button>
      </div>
      <div id="content" class="content" aria-live="polite">
        <div class="state state-loading">Loading…</div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
